workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - validate
  - test
  - publish
  - deploy
  - verify

default:
  tags:
    - bm-cluster
  interruptible: true

variables:
  APP_VERSION: "$CI_PIPELINE_IID-$CI_COMMIT_SHORT_SHA"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  NODE_OPTIONS: "--max-old-space-size=1536"

validate:manifests:
  stage: validate
  image: docker.io/library/alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f
  before_script:
    - apk add --no-cache kubectl
  script:
    - kubectl kustomize infra/k8s/overlays/bm-cluster >/dev/null
    - kubectl apply --dry-run=client --validate=false -f infra/argocd/thoughty-app.yaml >/dev/null

test:server:
  stage: test
  image: docker.io/library/node@sha256:76789712cd1ae89a1225eac9077010d68987a423588042dac30446f502f1858c
  cache:
    key: thoughty-server-npm-v1
    paths:
      - .cache/npm/
    policy: pull-push
  before_script:
    - cd thoughty-server
    - npm ci
  script:
    - npx eslint "{src,scripts,test}/**/*.ts"
    - npm run test:cov -- --maxWorkers=2
    - npm run build
    - npm audit --audit-level=high
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - thoughty-server/coverage/

test:web:
  stage: test
  image: docker.io/library/node@sha256:76789712cd1ae89a1225eac9077010d68987a423588042dac30446f502f1858c
  cache:
    key: thoughty-web-npm-v1
    paths:
      - .cache/npm/
    policy: pull-push
  before_script:
    - cd thoughty-web
    - npm ci
  script:
    - npm run lint
    - npm run typecheck
    - npm run test:coverage -- --maxWorkers=2
    - npm run build
    - npm audit --audit-level=high
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - thoughty-web/coverage/

test:browser:
  stage: test
  image:
    name: mcr.microsoft.com/playwright@sha256:eac9b0a5312cdab40ee8c2429df5bf19bffdccf8f3bf3c42268e173f97541645
    entrypoint: [""]
  before_script:
    - cd thoughty-web
    - npm ci
  script:
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - thoughty-web/playwright-report/
      - thoughty-web/test-results/

.publish-image:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$auth" > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "$BUILD_CONTEXT"
      --dockerfile "$DOCKERFILE"
      --destination "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$APP_VERSION"
      --snapshot-mode=redo
      --use-new-run
      --cleanup
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish:server:
  extends: .publish-image
  variables:
    BUILD_CONTEXT: "$CI_PROJECT_DIR/thoughty-server"
    DOCKERFILE: "$CI_PROJECT_DIR/thoughty-server/Dockerfile"
    IMAGE_NAME: thoughty-server

publish:web:
  extends: .publish-image
  variables:
    BUILD_CONTEXT: "$CI_PROJECT_DIR/thoughty-web"
    DOCKERFILE: "$CI_PROJECT_DIR/thoughty-web/Dockerfile"
    IMAGE_NAME: thoughty-web

deploy:gitops:
  stage: deploy
  image: docker.io/library/alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f
  resource_group: thoughty-production
  before_script:
    - apk add --no-cache git kubectl
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - test "$CI_COMMIT_SHA" = "$(git rev-parse "origin/$CI_DEFAULT_BRANCH")"
    - git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
    - infra/scripts/set-image-tags.sh "$APP_VERSION"
    - git config user.name "Thoughty GitLab CI"
    - git config user.email "gitlab-ci@swirlit.dev"
    - git add infra/k8s/overlays/bm-cluster/kustomization.yaml
    - 'git commit -m "deploy: $APP_VERSION [skip ci]"'
    - git push origin "HEAD:$CI_DEFAULT_BRANCH"
    - DEPLOY_REVISION="$(git rev-parse HEAD)"
    - printf 'DEPLOY_REVISION=%s\n' "$DEPLOY_REVISION" > deploy.env
    - kubectl apply -f infra/argocd/thoughty-app.yaml
    - kubectl annotate application thoughty -n infra argocd.argoproj.io/refresh=hard --overwrite
  artifacts:
    reports:
      dotenv: deploy.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify:rollout:
  stage: verify
  image: docker.io/library/alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f
  before_script:
    - apk add --no-cache curl jq kubectl
  script:
    - |
      set -eu
      deadline=$(( $(date +%s) + 900 ))
      while [ "$(date +%s)" -lt "$deadline" ]; do
        application="$(kubectl get application thoughty -n infra -o json 2>/dev/null || true)"
        revision="$(printf '%s' "$application" | jq -r '.status.sync.revision // empty')"
        sync="$(printf '%s' "$application" | jq -r '.status.sync.status // empty')"
        health="$(printf '%s' "$application" | jq -r '.status.health.status // empty')"
        printf 'Argo CD: revision=%s sync=%s health=%s\n' "${revision:-unknown}" "${sync:-unknown}" "${health:-unknown}"
        if [ "$revision" = "$DEPLOY_REVISION" ] && [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]; then
          break
        fi
        sleep 10
      done
      [ "$revision" = "$DEPLOY_REVISION" ] && [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]
    - curl --fail --silent --show-error http://thoughty-server.apps.svc.cluster.local:3001/api/health >/dev/null
    - curl --fail --silent --show-error http://thoughty-web.apps.svc.cluster.local/ >/dev/null
  needs:
    - job: deploy:gitops
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
