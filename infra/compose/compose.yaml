

services:
  app:
    build:
      context: ../../.devcontainer
      dockerfile: Dockerfile
    volumes:
      - ../../:/workspace:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    tty: true
    environment:
      # Container-to-container networking: localhost inside the app container is
      # not the db/storage services, so point the backend at them by service name.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: journal
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: thoughty-attachments
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    networks:
      - thoughty-net
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: journal
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - thoughty-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  # RustFS: an S3-compatible server (Apache-2.0) that replaces MinIO, whose
  # images are no longer published.
  storage:
    image: rustfs/rustfs:1.0.3
    restart: always
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage-data:/data
    networks:
      - thoughty-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

volumes:
  db-data:
  storage-data:

networks:
  thoughty-net:
