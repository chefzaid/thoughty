apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thoughty-ingress
  namespace: thoughty
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: thoughty-thoughty-upload-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - thoughty.example.com
      secretName: thoughty-tls
  rules:
    - host: thoughty.example.com  # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: thoughty-web
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thoughty-api-ingress
  namespace: thoughty
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: thoughty-thoughty-upload-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - thoughty.example.com
      secretName: thoughty-tls
  rules:
    - host: thoughty.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: thoughty-server
                port:
                  number: 3001
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: thoughty-upload-limit
  namespace: thoughty
spec:
  buffering:
    maxRequestBodyBytes: 10485760
