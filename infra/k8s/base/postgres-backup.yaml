apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: thoughty
  labels:
    app: postgres
    job: postgres-backup
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: postgres
            job: postgres-backup
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/role: "thoughty-postgres"
            vault.hashicorp.com/agent-inject-secret-database: "secret/data/thoughty/database"
            vault.hashicorp.com/agent-inject-secret-backup: "secret/data/thoughty/backup"
            vault.hashicorp.com/agent-inject-template-database: |
              {{- with secret "secret/data/thoughty/database" -}}
              export POSTGRES_USER="{{ .Data.data.POSTGRES_USER }}"
              export POSTGRES_PASSWORD="{{ .Data.data.POSTGRES_PASSWORD }}"
              export POSTGRES_DB="{{ .Data.data.POSTGRES_DB }}"
              {{- end }}
            vault.hashicorp.com/agent-inject-template-backup: |
              {{- with secret "secret/data/thoughty/backup" -}}
              export AWS_ACCESS_KEY_ID="{{ .Data.data.POSTGRES_BACKUP_ACCESS_KEY }}"
              export AWS_SECRET_ACCESS_KEY="{{ .Data.data.POSTGRES_BACKUP_SECRET_KEY }}"
              {{- end }}
        spec:
          serviceAccountName: thoughty-postgres
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: postgres-backup
              image: postgres:16-alpine
              envFrom:
                - configMapRef:
                    name: thoughty-config
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  . /vault/secrets/database
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  pg_dump \
                    -h postgres \
                    -U "$POSTGRES_USER" \
                    -d "$POSTGRES_DB" \
                    --format=custom \
                    --no-owner \
                    --no-acl \
                    --file=/backup/thoughty-postgres.dump
                  cd /backup
                  sha256sum thoughty-postgres.dump > thoughty-postgres.dump.sha256
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: backup-tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          containers:
            - name: backup-upload
              image: amazon/aws-cli:2.15.57
              envFrom:
                - configMapRef:
                    name: thoughty-config
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  . /vault/secrets/backup
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  aws --endpoint-url "$POSTGRES_BACKUP_ENDPOINT" \
                    --region "$POSTGRES_BACKUP_REGION" \
                    s3 cp /backup/thoughty-postgres.dump "s3://${POSTGRES_BACKUP_BUCKET}/${POSTGRES_BACKUP_BASE_PREFIX}/thoughty-postgres-${timestamp}.dump" \
                    --only-show-errors
                  aws --endpoint-url "$POSTGRES_BACKUP_ENDPOINT" \
                    --region "$POSTGRES_BACKUP_REGION" \
                    s3 cp /backup/thoughty-postgres.dump.sha256 "s3://${POSTGRES_BACKUP_BUCKET}/${POSTGRES_BACKUP_BASE_PREFIX}/thoughty-postgres-${timestamp}.dump.sha256" \
                    --only-show-errors
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: upload-tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backup
              emptyDir: {}
            - name: backup-tmp
              emptyDir: {}
            - name: upload-tmp
              emptyDir: {}
