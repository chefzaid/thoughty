- op: add
  path: /metadata/annotations/argocd.argoproj.io~1sync-wave
  value: "1"
- op: add
  path: /metadata/annotations/nginx.ingress.kubernetes.io~1auth-url
  value: http://oauth2-proxy.swirlit.internal:4180/oauth2/auth
- op: add
  path: /metadata/annotations/nginx.ingress.kubernetes.io~1auth-signin
  value: https://keycloak.swirlit.dev/oauth2/start?rd=https://$host$escaped_request_uri
- op: add
  path: /metadata/annotations/nginx.ingress.kubernetes.io~1auth-response-headers
  value: X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Groups,X-Auth-Request-Access-Token
- op: replace
  path: /spec/tls/0/hosts/0
  value: thoughty.swirlit.dev
- op: replace
  path: /spec/tls/0/secretName
  value: swirlit-dev-tls
- op: replace
  path: /spec/rules/0/host
  value: thoughty.swirlit.dev
