apiVersion: batch/v1
kind: Job
metadata:
  name: thoughty-db-setup
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: setup
          image: postgres:16-alpine
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              export PGPASSWORD="$POSTGRES_ADMIN_PASSWORD"
              psql_admin="psql -h postgres.swirlit.internal -U $POSTGRES_ADMIN_USER -d postgres"
              $psql_admin -v app_user="$POSTGRES_USER" -v app_password="$POSTGRES_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I WITH LOGIN PASSWORD %L', :'app_user', :'app_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'app_user')
              \gexec
              SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'app_user', :'app_password')
              \gexec
              SQL
              $psql_admin -v app_db="$POSTGRES_DB" -v app_user="$POSTGRES_USER" <<'SQL'
              SELECT format('CREATE DATABASE %I OWNER %I', :'app_db', :'app_user')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'app_db')
              \gexec
              SQL
          envFrom:
            - secretRef:
                name: thoughty-db-admin
            - secretRef:
                name: thoughty-database
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
