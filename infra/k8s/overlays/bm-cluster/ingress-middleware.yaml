apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: thoughty-sso
  namespace: apps
spec:
  forwardAuth:
    # The proxy's static upstream preserves login return URLs and backend 401s.
    address: http://oauth2-proxy.swirlit.internal:4180/
    trustForwardHeader: true
    preserveLocationHeader: true
    forwardBody: false
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
      - X-Auth-Request-Access-Token
    addAuthCookiesToResponse:
      - _oauth2_proxy
