apiVersion: apps/v1
kind: Deployment
metadata:
  name: thoughty-web
  namespace: thoughty
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: thoughty-registry-auth
