apiVersion: v1
kind: ConfigMap
metadata:
  name: thoughty-config
  namespace: thoughty
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  POSTGRES_HOST: postgres.swirl.internal
  REDIS_HOST: redis.swirl.internal
  CORS_ORIGIN: https://thoughty.swirlit.dev
  FRONTEND_URL: https://thoughty.swirlit.dev
  # The Contact page's messages
  CONTACT_EMAIL: contact@swirlit.dev
  # Two proxies precede the API: Cloudflare (an edge address, or the HA tunnel connector on
  # loopback) and Traefik. Trusting only private ranges would key rate limits on the shared
  # Cloudflare edge address. Traefik drops X-Forwarded-For from peers outside its trusted edge
  # ranges, so counting hops cannot be spoofed by requests that bypass Cloudflare.
  TRUST_PROXY: "2"
  KEYCLOAK_ISSUER: https://keycloak.swirlit.dev/auth/realms/swirl
  KEYCLOAK_JWKS_URI: http://keycloak.swirl.internal:8080/auth/realms/swirl/protocol/openid-connect/certs
  KEYCLOAK_AUDIENCE: oauth2-proxy
  # Runtime feature flags from the in-cluster Unleash (unleash.yaml); its client token is
  # FEATURE_FLAG_PROVIDER_TOKEN in Vault apps/thoughty/app. Until it answers, every feature stays on.
  FEATURE_FLAG_PROVIDER: unleash
  FEATURE_FLAG_PROVIDER_URL: http://thoughty-unleash:4242/api
