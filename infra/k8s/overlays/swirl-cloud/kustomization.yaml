apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - ../../base
  - external-secrets.yaml
  - database-setup-job.yaml
  - migration-job.yaml
  - network-policy.yaml
  - observability.yaml
  - registry-credentials.yaml
  - ingress-middleware.yaml
  - sso-ingress.yaml
components:
  - ../../components/worker
patches:
  - path: configmap-patch.yaml
  - path: server-patch.yaml
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: thoughty-ingress
  - path: api-ingress-patch.yaml
    target:
      kind: Ingress
      name: thoughty-api-ingress
  - path: upload-ingress-patch.yaml
    target:
      kind: Ingress
      name: thoughty-upload-ingress
  - path: postgres-backup-patch.yaml
  - path: web-patch.yaml
  - path: worker-patch.yaml
  - path: worker-sync-wave-patch.yaml
images:
  - name: thoughty-server
    newName: registry.swirlit.dev/swirlit/thoughty/thoughty-server
    newTag: 1.12.3
  - name: thoughty-web
    newName: registry.swirlit.dev/swirlit/thoughty/thoughty-web
    newTag: 1.12.3
  # Client for the db-setup hook and the backup CronJob: the multi-arch index digest
  # (Alpine 3.24, built 2026-10-21); see docs/security.md (Container Images).
  - name: postgres
    newName: docker.io/library/postgres
    newTag: 18.6-alpine3.24
    digest: sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
