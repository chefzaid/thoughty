# Creates Unleash's role and database on the platform PostgreSQL if missing, as thoughty-db-setup
# does for the app's, and keeps the role's password in step with Vault (apps/thoughty/unleash).
# Unleash runs its own schema migrations when it starts.
apiVersion: batch/v1
kind: Job
metadata:
  name: thoughty-unleash-db-setup
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: postgres:18.6-alpine3.24
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              export PGPASSWORD="$POSTGRES_ADMIN_PASSWORD"
              psql_admin="psql -h postgres.swirl.internal -U $POSTGRES_ADMIN_USER -d postgres -v ON_ERROR_STOP=1"
              $psql_admin -v unleash_user="$DATABASE_USERNAME" -v unleash_password="$DATABASE_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I WITH LOGIN PASSWORD %L', :'unleash_user', :'unleash_password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'unleash_user')
              \gexec
              SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L', :'unleash_user', :'unleash_password')
              \gexec
              SQL
              $psql_admin -v unleash_db="$DATABASE_NAME" -v unleash_user="$DATABASE_USERNAME" <<'SQL'
              SELECT format('CREATE DATABASE %I OWNER %I', :'unleash_db', :'unleash_user')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'unleash_db')
              \gexec
              SQL
          env:
            - name: POSTGRES_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: thoughty-db-admin
                  key: POSTGRES_ADMIN_USER
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: thoughty-db-admin
                  key: POSTGRES_ADMIN_PASSWORD
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: thoughty-unleash
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: thoughty-unleash
                  key: DATABASE_PASSWORD
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: thoughty-unleash
                  key: DATABASE_NAME
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
