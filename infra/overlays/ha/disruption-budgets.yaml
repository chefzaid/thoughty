apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thoughty-server
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: thoughty-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thoughty-web
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: thoughty-web
