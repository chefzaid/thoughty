apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thoughty-database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: thoughty-database
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: application/thoughty/database
---
