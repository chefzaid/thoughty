# Security headers for every response. Included in each block that sets its own add_header,
# because NGINX drops inherited add_header directives in such a block.
#
# CSP: the Vite build has no inline scripts or <style> tags; React applies style props through
# the CSSOM, which style-src does not restrict. Attachments, previews and recordings are shown
# from blob: URLs, profile pictures are data: URLs or Google account pictures, and the audio
# captions track is a data: URL. Keycloak SSO and cloud OAuth are top-level navigations.
# PDF and text previews are blob: frames, which inherit this policy; the browser's own viewer
# documents use style attributes, so style-src-attr allows them (stylesheets stay 'self').
# The service worker (/sw.js), the PDF.js worker and the speech-recognition worker load as workers from
# the app's origin under script-src 'self' (no worker-src needed), and the service worker's own requests
# are same-origin (connect-src 'self'). script-src also has 'wasm-unsafe-eval', the least that lets the
# speech-recognition worker compile the ONNX runtime's WebAssembly (served from /assets/, never a blob:
# or another site's script); it allows no eval() of JavaScript. That worker downloads only the Whisper
# model's files, from Hugging Face over https (connect-src https:), for the diaries set to the writer's
# own model (docs/security.md, "Speech recognition on the device").
# connect-src also allows, for the diaries set to the writer's own model, any https address and this
# device's loopback addresses over plain http, on any port: the browser calls the model server the writer
# runs (Ollama, LM Studio, llama.cpp, on this device or elsewhere behind https) directly, so their text never
# reaches the API. `https:` (chosen by the owner on 2026-11-24) means connect-src no longer limits where a
# script running in the page could send data; script-src 'self', no inline scripts, object-src 'none' and
# base-uri 'self' are what keep such a script out (docs/security.md, "Writer's own model"). Plain http to
# any other host stays refused, here and in the web app.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com; media-src 'self' blob: data:; font-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# TLS terminates at the ingress; browsers ignore this header on plain HTTP. Same policy as the API.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The memoir voice recorder and live dictation need the microphone.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# strict-origin-when-cross-origin, and no-referrer on the pages whose address carries a token ($referrer_policy, nginx.conf).
add_header Referrer-Policy $referrer_policy always;
# Only the pages whose address carries a token are sent with it; an empty value sends no header.
add_header X-Robots-Tag $robots_tag always;
