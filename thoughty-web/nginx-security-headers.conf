# Security headers for every response. Included in each block that sets its own add_header,
# because NGINX drops inherited add_header directives in such a block.
#
# CSP: the Vite build has no inline scripts or <style> tags; React applies style props through
# the CSSOM, which style-src does not restrict. Attachments, previews and recordings are shown
# from blob: URLs, profile pictures are data: URLs or Google account pictures, and the audio
# captions track is a data: URL. Keycloak SSO and cloud OAuth are top-level navigations.
# PDF and text previews are blob: frames, which inherit this policy; the browser's own viewer
# documents use style attributes, so style-src-attr allows them (stylesheets stay 'self').
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://lh3.googleusercontent.com; media-src 'self' blob: data:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# TLS terminates at the ingress; browsers ignore this header on plain HTTP. Same policy as the API.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The memoir voice recorder needs the microphone.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
