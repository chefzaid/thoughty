# A private share link's address carries its secret token: the page (/s/<token>) and the API it calls
# (/api/shared/<token>) are left out of the access log, sent with no referrer and kept out of search engines.
map $request_uri $thoughty_share_link {
    ~^/s/            1;
    ~^/api/shared/   1;
    default          0;
}
map $thoughty_share_link $thoughty_access_log {
    1       0;
    default 1;
}
map $thoughty_share_link $referrer_policy {
    1       "no-referrer";
    default "strict-origin-when-cross-origin";
}
map $thoughty_share_link $robots_tag {
    1       "noindex, nofollow, noarchive";
    default "";
}

server {
    listen 8080;
    access_log /var/log/nginx/access.log main if=$thoughty_access_log;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (CSP, HSTS, Permissions-Policy, framing, sniffing, referrer)
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # API proxy to backend service
    location /api/ {
        # Video attachments go up to 50 MiB (the API enforces each route's own limit); the ingress
        # sends /api straight to the server, so this applies only where this proxy is used.
        client_max_body_size 51m;
        proxy_pass http://thoughty-server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
