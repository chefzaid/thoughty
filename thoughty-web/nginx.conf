# Addresses that carry a secret token are left out of the access log, sent with no referrer (so the
# page's own script, style and API requests do not pass the token on before the page removes it from
# the address) and kept out of search engines: a private share link's page (/s/<token>) and the API it
# calls (/api/shared/<token>), and the pages the emailed links open: password reset
# (/reset-password?token=), sign-up (/complete-sign-up?token=) and email verification (/verify-email?token=).
# The installed app's share target carries the writer's own words in its address (the service worker
# sends the page on to /share-target?title=&text=&url=), so it is kept out the same way until the page
# moves it to the journal.
map $request_uri $thoughty_secret_link {
    ~^/s/                1;
    ~^/api/shared/       1;
    ~^/reset-password    1;
    ~^/complete-sign-up  1;
    ~^/verify-email      1;
    ~^/share-target      1;
    default              0;
}
map $thoughty_secret_link $thoughty_access_log {
    1       0;
    default 1;
}
map $thoughty_secret_link $referrer_policy {
    1       "no-referrer";
    default "strict-origin-when-cross-origin";
}
map $thoughty_secret_link $robots_tag {
    1       "noindex, nofollow, noarchive";
    default "";
}

# The sitemap and robots.txt name the site by the address each request came to (the image serves any
# domain); TLS ends in front of this server, which says so in X-Forwarded-Proto.
map $http_x_forwarded_proto $thoughty_site_scheme {
    https   https;
    default $scheme;
}

server {
    listen 8080;
    access_log /var/log/nginx/access.log main if=$thoughty_access_log;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (CSP, HSTS, Permissions-Policy, framing, sniffing, referrer)
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip (the speech-recognition worker's 27 MB WebAssembly runtime goes down to about 7 MB)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;
    gzip_min_length 256;

    # API proxy to backend service
    location /api/ {
        # Video attachments go up to 50 MiB (the API enforces each route's own limit); the ingress
        # sends /api straight to the server, so this applies only where this proxy is used.
        client_max_body_size 51m;
        proxy_pass http://thoughty-server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The service worker (built into /sw.js) and the page it keeps for offline use are always
    # revalidated, so a new deploy reaches the browser on its next visit: the worker's cache is
    # versioned per build and an online page load always asks the network first. Both keep the
    # security headers: the worker runs under the CSP it was served with, and a page it serves from
    # its cache carries the headers stored with it.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # What is shared to the installed app is posted here, and the service worker receives it in the
    # browser (src/serviceWorker/shareTargetReceiver.ts). A post that reaches the server found no worker
    # (none installed yet, or cleared): its body is dropped unread and the page says it was not received.
    # The redirect stays relative, since TLS ends in front of this server.
    location = /share-target {
        client_max_body_size 100m;
        absolute_redirect off;
        if ($request_method = POST) {
            return 303 /share-target?unreceived=1;
        }
        try_files $uri /index.html;
    }

    # The build writes both files with a placeholder for the site's address (src/utils/searchEngineFiles.ts),
    # filled in here; they list the public pages in English and under /fr/ in French.
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        sub_filter '__THOUGHTY_SITE_ORIGIN__' '$thoughty_site_scheme://$host';
        sub_filter_once off;
        sub_filter_types text/xml text/plain;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback (an unknown path, a French public page under /fr/ included, is answered with
    # /index.html through the block above)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
