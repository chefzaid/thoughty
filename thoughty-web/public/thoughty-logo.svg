<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Thoughty">
  <title>Thoughty</title>
  <defs>
    <linearGradient id="thoughty-tile" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <radialGradient id="thoughty-glow" cx="52" cy="54" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thoughty-ink" x1="14" y1="0" x2="50" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#thoughty-tile)"/>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#thoughty-glow)"/>

  <!-- Open journal: two pages meeting at the spine -->
  <path d="M31 47.5C25.4 44.2 19.2 43.4 12.5 44.6V25.2C19.2 23.8 25.6 24.8 31 28.6Z" fill="#FFFFFF" fill-opacity="0.86"/>
  <path d="M33 47.5C38.6 44.2 44.8 43.4 51.5 44.6V25.2C44.8 23.8 38.4 24.8 33 28.6Z" fill="#FFFFFF"/>

  <!-- Written lines -->
  <g fill="none" stroke="url(#thoughty-ink)" stroke-linecap="round" stroke-width="1.8" stroke-opacity="0.55">
    <path d="M16.5 31.2C20.4 30.6 24 31.1 27.4 32.8"/>
    <path d="M16.5 36.4C20.4 35.8 24 36.3 27.4 38"/>
    <path d="M36.6 32.8C40 31.1 43.6 30.6 47.5 31.2"/>
    <path d="M36.6 38C40 36.3 43.6 35.8 47.5 36.4"/>
  </g>

  <!-- A thought sparking above the spine -->
  <path d="M32 7.5C32.8 12.4 34.3 13.9 39.2 14.7C34.3 15.5 32.8 17 32 21.9C31.2 17 29.7 15.5 24.8 14.7C29.7 13.9 31.2 12.4 32 7.5Z" fill="#FFFFFF"/>
  <circle cx="42.5" cy="9.5" r="1.6" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="21.5" cy="19.5" r="1.1" fill="#FFFFFF" fill-opacity="0.6"/>
</svg>
